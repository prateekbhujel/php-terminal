name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: checks
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Upload Windows artifacts
        uses: php/php-windows-builder/release@7e62efa601b7387f96303e4e636f1655e1682cd6 # v1
        with:
          release: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
