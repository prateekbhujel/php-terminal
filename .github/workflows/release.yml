name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          header = pathlib.Path('php_terminal.h').read_text()
          version = re.search(r'#\s*define PHP_TERMINAL_VERSION "([^"]+)"', header)[1]
          assert tag == 'v' + version, 'Release tag must match the extension version'
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          assert re.search(r'^## ' + re.escape(version) + r' - \d{4}-\d{2}-\d{2}$', changelog, re.M), 'Missing dated release notes'
          PY

  checks:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-24.04
    needs: [version, checks]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft and upload Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes ""
          fi
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .immutable)
          if [ "$immutable" = true ]; then
            echo "Release $RELEASE_TAG is immutable" >&2
            exit 1
          fi
          shopt -s nullglob
          artifacts=(artifacts/php*)
          ((${#artifacts[@]})) || { echo "No Windows release artifacts found" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber

      - name: Publish with release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          awk '/^## / { if (found) exit; found=1; next } found' CHANGELOG.md > "$RUNNER_TEMP/terminal-release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/terminal-release-notes.md" --draft=false
