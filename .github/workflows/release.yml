name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          header = pathlib.Path('php_terminal.h').read_text()
          version = re.search(r'#\s*define PHP_TERMINAL_VERSION "([^"]+)"', header)[1]
          assert tag == 'v' + version, 'Release tag must match the extension version'
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          assert re.search(r'^## ' + re.escape(version) + r' - \d{4}-\d{2}-\d{2}$', changelog, re.M), 'Missing dated release notes'
          PY

  checks:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: [version, checks]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Upload Windows artifacts
        uses: php/php-windows-builder/release@7e62efa601b7387f96303e4e636f1655e1682cd6 # v1
        with:
          release: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

      - name: Publish with release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          awk '/^## / { if (found) exit; found=1; next } found' CHANGELOG.md > "$RUNNER_TEMP/terminal-release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/terminal-release-notes.md" --draft=false
