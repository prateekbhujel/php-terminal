name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate PIE package metadata
        run: composer validate --strict

  unix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.php-version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', 'nightly']
        include:
          - os: macos-14
            php-version: '8.4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Prepare build
        run: |
          phpize
          ./configure

      - name: Build
        run: make -j2

      - name: Verify extension loads
        run: php -n -d extension="$PWD/modules/terminal.so" -r 'exit(extension_loaded("terminal") ? 0 : 1);'

      - name: Test
        run: |
          ulimit -n 2048
          make test REPORT_EXIT_STATUS=1 NO_INTERACTION=1 TESTS="--show-diff"

      - name: Upload failing test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpt-${{ matrix.os }}-${{ matrix.php-version }}
          path: |
            tests/**/*.diff
            tests/**/*.out
            tests/**/*.log
            config.log
          retention-days: 7

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        arch: ['x64']
        ts: ['nts', 'ts']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-terminal
